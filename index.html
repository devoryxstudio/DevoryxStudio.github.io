<!doctype html>
<html>
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Kaushal Gajera – Flutter Developer Portfolio. Building performant, pixel-perfect mobile & web apps."
    />
    <meta
      name="keywords"
      content="Flutter, Dart, Mobile Developer, Portfolio, Kaushal Gajera"
    />
    <meta name="author" content="Kaushal Gajera" />

    <!-- Open Graph -->
    <meta property="og:title" content="Kaushal Gajera – Flutter Developer" />
    <meta
      property="og:description"
      content="Premium Flutter portfolio showcasing mobile & web development expertise."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Kaushal – Portfolio" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Kaushal Gajera – Flutter Developer</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        /* Prevent white flash before Flutter paints */
      }

      /* ── Instant loading screen (shown before Flutter boots) ── */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        transition: opacity 0.6s ease;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-monogram {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #ffffff;
        opacity: 0;
        animation: loaderPulse 1.8s ease-in-out infinite;
      }

      .loader-ring {
        margin-top: 26px;
        width: 34px;
        height: 34px;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: loaderSpin 0.9s linear infinite;
      }

      .loader-label {
        margin-top: 22px;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #6b6b6b;
      }

      @keyframes loaderSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes loaderPulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-ring,
        .loader-monogram {
          animation: none;
        }
        .loader-monogram {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown immediately; removed once Flutter renders its first frame -->
    <div id="app-loading" role="status" aria-label="Loading portfolio">
      <div class="loader-monogram">KG</div>
      <div class="loader-ring"></div>
      <div class="loader-label">Loading</div>
    </div>

    <script>
      (function () {
        function removeLoader() {
          var el = document.getElementById("app-loading");
          if (!el) return;
          el.classList.add("fade-out");
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 650);
        }
        // Flutter dispatches this on window once the first frame is painted.
        window.addEventListener("flutter-first-frame", removeLoader);
        // Safety net in case the event is missed for any reason.
        setTimeout(removeLoader, 15000);
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
