    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        /* Prevent white flash before Flutter paints */
      }

      /* ── Instant loading screen (shown before Flutter boots) ── */
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        transition: opacity 0.6s ease;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Space-theme loader: one pulsing star; the Flutter starfield then
         "ignites" around it once the app paints its first frame. */
      .loader-star {
        position: relative;
        width: 120px;
        height: 120px;
      }
      .loader-star .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.55),
          0 0 40px 10px rgba(255, 255, 255, 0.12);
        animation: starPulse 1.8s ease-in-out infinite;
      }
      .loader-star .flare-h,
      .loader-star .flare-v {
        position: absolute;
        left: 50%;
        top: 50%;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0)
        );
        animation: flarePulse 1.8s ease-in-out infinite;
      }
      .loader-star .flare-h {
        width: 120px;
        height: 1px;
        margin: -0.5px 0 0 -60px;
      }
      .loader-star .flare-v {
        width: 1px;
        height: 120px;
        margin: -60px 0 0 -0.5px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0.55),
          rgba(255, 255, 255, 0)
        );
      }

      .loader-label {
        margin-top: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #6b6b6b;
      }

      @keyframes starPulse {
        0%,
        100% {
          transform: scale(0.8);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.25);
          opacity: 1;
        }
      }

      @keyframes flarePulse {
        0%,
        100% {
          transform: scale(0.55);
          opacity: 0.4;
        }
        50% {
          transform: scale(1);
          opacity: 0.9;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-star .core,
        .loader-star .flare-h,
        .loader-star .flare-v {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown immediately; removed once Flutter renders its first frame -->
    <div id="app-loading" role="status" aria-label="Loading portfolio">
      <div class="loader-star" aria-hidden="true">
        <div class="flare-h"></div>
        <div class="flare-v"></div>
        <div class="core"></div>
      </div>
      <div class="loader-label">Igniting</div>
    </div>

    <script>
      (function () {
        function removeLoader() {
          var el = document.getElementById("app-loading");
          if (!el) return;
          el.classList.add("fade-out");
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }, 650);
        }
        // Flutter dispatches this on window once the first frame is painted.
        window.addEventListener("flutter-first-frame", removeLoader);
        // Safety net in case the event is missed for any reason.
        setTimeout(removeLoader, 15000);
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>
